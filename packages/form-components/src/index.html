<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>form-components dev harness</title>
    <script type="module" src="/build/wb-form.esm.js"></script>
    <script nomodule src="/build/wb-form.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 960px; margin: 40px auto; }
      .layout { display: flex; gap: 16px; align-items: flex-start; }
      wb-palette { flex: 0 0 180px; }
      wb-canvas { flex: 1; }
      wb-inspector { flex: 0 0 260px; }
      pre { background: #1c1c1a; color: #d9d9d3; padding: 12px; border-radius: 8px; font-size: 12px; }
      .section { margin-top: 24px; }
      .section-title { font-weight: 600; margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <h1>form-components dev harness</h1>
    <p>Manual smoke test: click a palette item to add a field, drag the grip handle to reorder, select a row to edit in the inspector, submit the form.</p>

    <div class="layout">
      <wb-palette></wb-palette>
      <wb-canvas id="canvas"></wb-canvas>
      <wb-inspector id="inspector"></wb-inspector>
    </div>

    <div class="section">
      <div class="section-title">Builder payload</div>
      <button id="dump-builder">Dump builder payload</button>
      <button id="export-json">Export JSON</button>
    </div>

    <div class="section">
      <div class="section-title">Load into canvas</div>
      <textarea id="import-input" rows="6" style="width:100%;font-family:monospace;font-size:12px;" placeholder='Paste JSON like [{"id":1,"type":"text","label":"Name"}]'></textarea>
      <div style="margin-top:8px;display:flex;gap:8px;align-items:center;">
        <input type="file" id="import-file" accept="application/json" />
        <button id="load-into-canvas">Load into canvas</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Rendered form</div>
      <wb-form-renderer id="renderer"></wb-form-renderer>
    </div>

    <div>Last wbChange payload:</div>
    <pre id="out">—</pre>

    <div>Selected field ID:</div>
    <pre id="selected">—</pre>

    <script>
      const palette = document.querySelector('wb-palette');
      const canvas = document.getElementById('canvas');
      const inspector = document.getElementById('inspector');
      const renderer = document.getElementById('renderer');
      const out = document.getElementById('out');
      const selected = document.getElementById('selected');
      const dumpBtn = document.getElementById('dump-builder');
      const exportBtn = document.getElementById('export-json');
      const importInput = document.getElementById('import-input');
      const importFile = document.getElementById('import-file');
      const loadBtn = document.getElementById('load-into-canvas');

      let selectedId = null;
      let lastBuilderPayload = null;

      palette.addEventListener('wbAddField', (e) => {
        canvas.addField(e.detail.type, e.detail.label);
      });
      palette.addEventListener('wbPaletteDragStart', (e) => {
        canvas.beginExternalDrag();
      });
      palette.addEventListener('wbPaletteDragMove', (e) => {
        canvas.setExternalHoverIndex(e.detail.clientY);
      });
      palette.addEventListener('wbPaletteDragEnd', (e) => {
        if (e.detail) {
          canvas.commitExternalInsert(e.detail.type, e.detail.label);
        } else {
          canvas.cancelExternalDrag();
        }
      });
      canvas.addEventListener('wbChange', (e) => {
        lastBuilderPayload = e.detail;
        out.textContent = JSON.stringify(e.detail, null, 2);
        renderer.setFields(e.detail);
      });
      canvas.addEventListener('wbFieldSelected', (e) => {
        selectedId = e.detail.id;
        selected.textContent = String(selectedId);
        inspector.setField(e.detail);
      });
      canvas.addEventListener('wbFieldDeselected', () => {
        selectedId = null;
        selected.textContent = '—';
        inspector.setField(null);
      });
      canvas.addEventListener('wbFieldUpdated', (e) => {
        out.textContent = JSON.stringify(e.detail, null, 2);
      });
      inspector.addEventListener('wbFieldUpdated', (e) => {
        canvas.updateField(e.detail.id, e.detail.patch);
      });
      renderer.addEventListener('wbSubmit', (e) => {
        out.textContent = JSON.stringify(e.detail, null, 2);
      });
      dumpBtn.addEventListener('click', () => {
        out.textContent = JSON.stringify(lastBuilderPayload, null, 2);
      });
      exportBtn.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(lastBuilderPayload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'form-builder-state.json';
        a.click();
        URL.revokeObjectURL(url);
      });
      loadBtn.addEventListener('click', async () => {
        let raw;
        try {
          const file = importFile.files && importFile.files[0];
          if (file) {
            raw = await file.text();
          } else {
            raw = importInput.value;
          }
          const parsed = JSON.parse(raw);
          await canvas.importState(parsed);
        } catch (err) {
          out.textContent = 'Error loading into canvas: ' + (err && err.message ? err.message : String(err));
        }
      });
    </script>
  </body>
</html>
